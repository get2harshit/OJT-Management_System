server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's bundled mime.types doesn't include .mjs, so it falls back to
    # default_type (application/octet-stream) — browsers reject that as a
    # module script (e.g. the react-pdf/pdf.js worker), throwing "Failed to
    # load module script: ... non-JavaScript MIME type".
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
