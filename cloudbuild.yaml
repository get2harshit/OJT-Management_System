# Build and deploy the frontend to Cloud Run.
#
# This file exists because the image needs a build arg. Vite resolves
# import.meta.env while bundling, so which backend and which Supabase project an
# image talks to is decided during `docker build` and cannot be changed
# afterwards — a Cloud Run variable arrives long after the bundle was written.
# A trigger in "Dockerfile" mode has nowhere to put a --build-arg, which is how
# every environment ended up with the same fallback values baked in and the
# production bundle ended up calling the staging API.
#
# The addresses live in .env.staging and .env.production, in git. All a trigger
# supplies is which of them to use:
#
#   staging trigger (branch staging)  _BUILD_MODE=staging
#   main trigger    (branch main)     _BUILD_MODE=production
#
# An unknown or empty mode fails the build — see the Dockerfile, which is where
# that check lives so a local `docker build` gets it too.

substitutions:
  _SERVICE_NAME: ojt-management-system
  _REGION: asia-south1
  _REPOSITORY: cloud-run-source-deploy
  # Deliberately empty: a trigger that does not say which environment it is
  # building for must not produce an image.
  _BUILD_MODE: ''

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Tagged with BUILD_ID rather than SHORT_SHA: SHORT_SHA is empty when a
  # trigger is run by hand rather than by a push, which makes the tag end in
  # a bare colon and fails the build on an invalid image reference. BUILD_ID
  # is always set, and the build it names links back to the commit anyway.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=BUILD_MODE=${_BUILD_MODE}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}
      - .

  # Pushed here rather than through the top-level `images:` key, because that
  # push runs after every step and the deploy below needs the tag to exist.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE_NAME}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --quiet
